plugins { id "com.android.application" }
// The version number rises with every automatic build, so a newer file always installs over an older one.
def buildNo = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()
android {
    namespace "app.neonguitarlab"
    compileSdk 34
    defaultConfig {
        applicationId "app.neonguitarlab"
        minSdk 26
        targetSdk 34
        versionCode buildNo
        versionName "1." + buildNo
    }
    signingConfigs {
        release {
            storeFile rootProject.file("ngl-release.jks")
            storePassword "neonguitarlab"
            keyAlias "ngl"
            keyPassword "neonguitarlab"
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError false; checkReleaseBuilds false }
}
