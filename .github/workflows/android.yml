name: Android-App bauen
on:
  push:
    branches: [main]
    paths: ["index.html", "fonts/**", "android/**", ".github/workflows/android.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-app
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Seite in die App kopieren
        run: |
          mkdir -p android/app/src/main/assets/www
          cp index.html icon-192.png icon-512.png android/app/src/main/assets/www/
          cp -r fonts android/app/src/main/assets/www/
      - name: App bauen
        id: build
        working-directory: android
        run: |
          set -o pipefail
          gradle --no-daemon assembleRelease 2>&1 | tee ../build.log
      - name: Ergebnis im Zweig "apk" ablegen
        if: always()
        run: |
          mkdir out
          cp android/app/build/outputs/apk/release/*.apk out/NeonGuitarLead.apk 2>/dev/null || true
          tail -n 150 build.log > out/build.log 2>/dev/null || true
          echo "Build ${GITHUB_RUN_NUMBER} · ${GITHUB_SHA} · $(date -u +%FT%TZ) · ${{ steps.build.outcome }}" > out/STAND.txt
          cd out
          git init -q -b apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "App-Build ${GITHUB_RUN_NUMBER}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" apk
